spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 2026 修正：小方案容器記憶體有限，連線池數量也要跟著保守一點（原本 10 條對小型服務來說偏多，
      # 每條連線都有 client 端 buffer 開銷）。這個 App 目前的併發量不大，5 條夠用。
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update           # 首次啟動自動建表；正式環境可改 validate + db/schema_postgres.sql
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  thymeleaf:
    cache: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    default-encoding: UTF-8

app:
  mail:
    enabled: true
    from: ${MAIL_FROM}
  seed: ${APP_SEED:false}
