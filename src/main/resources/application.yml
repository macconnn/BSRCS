spring:
  application:
    name: baseball-score
  profiles:
    active: prod
  thymeleaf:
    cache: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Taipei
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d

server:
  port: 8080
  servlet:
    session:
      persistent: false

app:
  version: v1.1.0             # 目前部署的版本號，只顯示在登入頁角落
  pitch-detail-enabled: false   # 是否開放記錄球種／球速；false 時畫面不顯示，一律用「直球」／100 km/h
  otp:
    length: 6
    ttl-minutes: 10          # 驗證碼有效時間
    resend-interval-seconds: 60
    max-attempts: 5
  auth:
    cookie-name: BB_TOKEN
    token-ttl-days: 7
  mail:
    from: no-reply@baseball.local
    subject: "【線上棒球比賽紀錄表】登入驗證碼"
    enabled: true            # false = 只印在 log（本機開發免 SMTP）
  seed: true                 # 啟動時塞入示範球隊 / 比賽資料
  default-editor-email: ${APP_DEFAULT_EDITOR_EMAIL:a0983257133@gmail.com}   # 啟動時確保此帳號存在（EDITOR），已存在則不新增

logging:
  level:
    com.baseball.score: DEBUG