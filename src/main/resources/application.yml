spring:
  application:
    name: baseball-score
  profiles:
    active: dev
  thymeleaf:
    cache: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Taipei

server:
  port: 8080
  servlet:
    session:
      persistent: false

app:
  otp:
    length: 6
    ttl-minutes: 10          # 驗證碼有效時間
    resend-interval-seconds: 60
    max-attempts: 5
  auth:
    cookie-name: BB_TOKEN
    token-ttl-days: 7
  mail:
    from: no-reply@baseball.local
    subject: "【線上棒球比賽紀錄表】登入驗證碼"
    enabled: true            # false = 只印在 log（本機開發免 SMTP）
  seed: true                 # 啟動時塞入示範球隊 / 比賽資料

logging:
  level:
    com.baseball.score: DEBUG
