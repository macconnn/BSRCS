spring:
  application:
    name: baseball-score
  profiles:
    active: prod
  thymeleaf:
    cache: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Taipei
  web:
    resources:
      # 2026 修正：靜態資源（/js、/css…）改成長期快取（一年），
      # 因為 <script>/<link> 網址後面統一加上 ?v=<AssetVersion.VALUE>（見 com.baseball.score.config.AssetVersion），
      # 這個版本號是 App 啟動時的時間戳記，每次重新部署 App 一定會重啟、值就會換新，
      # 瀏覽器看到網址變了就一定會重新抓最新檔案，不會被瀏覽器快取或反向代理／CDN 快取卡住舊版本。
      cache:
        cachecontrol:
          max-age: 365d

server:
  port: 8080
  servlet:
    session:
      persistent: false

app:
  version: v1.2.0             # 目前部署的版本號，只顯示在登入頁角落
  pitch-detail-enabled: true   # 是否開放記錄球種／球速；false 時畫面不顯示，一律用「直球」／100 km/h
  otp:
    length: 6
    ttl-minutes: 10          # 驗證碼有效時間
    resend-interval-seconds: 60
    max-attempts: 5
  auth:
    cookie-name: BB_TOKEN
    token-ttl-days: 7
  mail:
    from: no-reply@baseball.local
    subject: "【線上棒球比賽紀錄表】登入驗證碼"
    enabled: true            # false = 只印在 log（本機開發免 SMTP）
  seed: true                 # 啟動時塞入示範球隊 / 比賽資料
  default-editor-email: ${APP_DEFAULT_EDITOR_EMAIL:a0983257133@gmail.com}   # 啟動時確保此帳號存在（EDITOR），已存在則不新增
  default-admin-email: ${APP_DEFAULT_ADMIN_EMAIL:sylvia@gmail.com}          # 啟動時確保此帳號存在（ADMIN），已存在則不新增
  default-admin-display-name: ${APP_DEFAULT_ADMIN_DISPLAY_NAME:Eden}

logging:
  level:
    com.baseball.score: DEBUG