<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|線上棒球比賽紀錄表（檢視模式）— ${gameName}|">線上棒球比賽紀錄表（檢視模式）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" th:href="@{/css/app.css(v=${T(com.baseball.score.config.AssetVersion).VALUE})}">
</head>
<body>
<div class="wrap-mobile">

    <header class="m-header">
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="ball">⚾</span>
            <div class="m-title">線上棒球比賽紀錄表<small>（檢視模式）</small></div>
        </div>
        <div style="display:flex;gap:6px;">
            <span class="badge" title="僅可檢視">👁</span>
            <button class="icon-btn" id="menuBtn" aria-label="選單">☰</button>
        </div>
    </header>

    <div class="card" id="menu" hidden style="margin-bottom:10px;">
        <div class="card-body" style="display:grid;gap:8px;">
            <a class="btn btn-block" href="/games">比賽列表</a>
            <a class="btn btn-block" href="/teams">球隊管理</a>
            <a class="btn btn-block btn-primary" href="/">編輯者登入</a>
        </div>
    </div>

    <section class="m-scorepanel">
        <div class="m-score-row">
            <div class="away" style="text-align:center;min-width:64px;">
                <div class="tname" data-f="awayName">-</div>
                <div class="tnum" data-f="awayScore">0</div>
            </div>
            <div class="m-score-mid">
                <div>▾ <span data-f="inningLabel">1局上</span></div>
                <div class="count"><span data-f="countLabel">0 - 0</span> | <span data-f="outs">0</span> OUT</div>
            </div>
            <div class="home" style="text-align:center;min-width:64px;">
                <div class="tname" data-f="homeName">-</div>
                <div class="tnum" data-f="homeScore">0</div>
            </div>
        </div>
        <div class="m-counts">
            <div class="count-col"><div class="label">好球 (S)</div><div class="dots" data-dots-strike></div></div>
            <div class="count-col"><div class="label">壞球 (B)</div><div class="dots" data-dots-ball></div></div>
            <div class="count-col"><div class="label">出局數</div><div class="dots" data-dots-out></div></div>
            <div class="bases-box">
                <div class="diamond">
                    <span class="base-label second">二壘</span>
                    <span class="base-label third">三壘</span>
                    <span class="base-label first">一壘</span>
                    <span class="base-label home">本壘</span>
                    <span class="base second" data-base-second></span>
                    <span class="base third" data-base-third></span>
                    <span class="base first" data-base-first></span>
                    <span class="base home"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- 打線（完整顯示兩隊球員資訊） -->
    <div class="m-lineups-full">
        <section class="card">
            <div class="lineup-head away">藍隊打線</div>
            <table class="lineup m-full-lineup">
                <thead><tr><th>棒次</th><th>球員</th><th>守備</th><th class="avg">打擊率</th></tr></thead>
                <tbody id="awayBody"></tbody>
            </table>
        </section>

        <section class="card">
            <div class="lineup-head home">紅隊打線</div>
            <table class="lineup m-full-lineup">
                <thead><tr><th>棒次</th><th>球員</th><th>守備</th><th class="avg">打擊率</th></tr></thead>
                <tbody id="homeBody"></tbody>
            </table>
        </section>
    </div>

    <!-- 記分板 -->
    <div class="scoreboard" id="scoreboard" style="margin-top:10px;overflow-x:auto;"></div>

    <!-- 近期賽況 -->
    <section class="card" style="margin-top:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;">
            <div style="font-size:15px;font-weight:700;">近期賽況</div>
            <span class="auto-refresh">🔄 <span data-refresh-label>自動更新：剛剛</span></span>
        </div>
        <div class="card-body"><div class="feed" id="feed"></div></div>
    </section>

    <!-- 版權標示 -->
    <footer style="text-align:center;color:var(--muted);font-size:12px;padding:18px 0 8px;">
        Copyright © 2026 SupremeEden. All rights reserved.
    </footer>
</div>

<div class="m-footer">
    <div class="batter-foot" id="batterFoot" style="border:none;background:transparent;padding:0;"></div>
    <div class="readonly-note">目前為檢視模式，僅顯示比賽紀錄</div>
</div>

<script th:src="@{/js/app.js(v=${T(com.baseball.score.config.AssetVersion).VALUE})}"></script>
<script th:inline="javascript">
    const GAME_ID = [[${gameId}]];

    function render(state) {
        const g = state.game;
        const set = (k, v) => document.querySelectorAll('[data-f="' + k + '"]').forEach(el => el.textContent = v);
        set('awayName', state.away.name); set('homeName', state.home.name);
        set('awayScore', state.away.score); set('homeScore', state.home.score);
        set('inningLabel', g.inningLabel); set('countLabel', g.countLabel); set('outs', g.outs);
        document.querySelector('.lineup-head.away').textContent = state.away.name + '打線';
        document.querySelector('.lineup-head.home').textContent = state.home.name + '打線';

        BB.renderCounts(document, g);
        BB.renderBases(document, g.bases);

        BB.renderLineup(document.getElementById('awayBody'), state.awayLineup, 'away');
        BB.renderLineup(document.getElementById('homeBody'), state.homeLineup, 'home');

        BB.renderScoreboard(document.getElementById('scoreboard'), state);
        BB.renderFeed(document.getElementById('feed'), state.events);

        BB.renderBatterFoot(document.getElementById('batterFoot'), state.currentBatter, '今日成績',
            g.battingSide === 'AWAY' ? 'away' : 'home', '目前打者');
    }

    document.getElementById('menuBtn').addEventListener('click', () => {
        const m = document.getElementById('menu');
        m.hidden = !m.hidden;
    });

    BB.initPlayerLog(GAME_ID);
    BB.poll(GAME_ID, render, 10000);   // 每 10 秒自動更新
</script>
</body>
</html>
