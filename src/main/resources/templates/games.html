<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的比賽 — 線上棒球比賽紀錄表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" th:href="@{/css/app.css(v=${T(com.baseball.score.config.AssetVersion).VALUE})}">
</head>
<body>
<div class="wrap" style="max-width:720px;">

    <header class="topbar">
        <div class="brand"><span class="ball">⚾</span><span>我的比賽</span></div>
        <div class="topbar-actions">
            <span class="badge badge-muted" th:if="${!canEdit}">👁 瀏覽者</span>
            <span class="badge" th:if="${canEdit}" th:text="'✎ ' + ${displayName}">編輯者</span>
            <a class="btn" href="/teams">球隊管理</a>
            <a class="btn" th:if="${isAdmin}" href="/admin/users">帳號管理</a>
            <a class="btn" th:if="${!canEdit}" href="/">編輯者登入</a>
            <button class="btn" th:if="${canEdit}" id="logoutBtn">登出</button>
        </div>
    </header>

    <input class="input" id="search" placeholder="搜尋比賽名稱、球隊或日期" style="margin-bottom:12px;">

    <div class="filter-tabs">
        <button class="tab active" data-filter="live">進行中<span class="count" id="cntLive" hidden>0</span></button>
        <button class="tab" data-filter="past">過往比賽</button>
        <button class="tab" data-filter="all">全部</button>
    </div>

    <div id="list"></div>

    <div th:if="${canEdit}" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" id="newGameBtn">＋ 新增比賽</button>
    </div>

    <section class="card" id="newGameForm" hidden style="margin-top:12px;">
        <div class="card-title">新增比賽</div>
        <div class="card-body" style="display:grid;gap:10px;">
            <label><span class="field-label">比賽名稱</span><input class="input" id="gName" placeholder="春季聯賽例行賽"></label>
            <label><span class="field-label">比賽日期</span><input class="input" id="gDate" type="date"></label>
            <label><span class="field-label">球場</span><input class="input" id="gVenue" placeholder="市立棒球場"></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <label><span class="field-label">客隊（先攻）</span><select class="input" id="gAway"></select></label>
                <label><span class="field-label">主隊（後攻）</span><select class="input" id="gHome"></select></label>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                        <span class="field-label" style="margin:0;">客隊打線安排</span>
                        <button type="button" class="btn btn-sm" id="autoAway">自動帶入前9位</button>
                    </div>
                    <div id="awayLineupBox" class="lineup-setup"></div>
                </div>
                <div>
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                        <span class="field-label" style="margin:0;">主隊打線安排</span>
                        <button type="button" class="btn btn-sm" id="autoHome">自動帶入前9位</button>
                    </div>
                    <div id="homeLineupBox" class="lineup-setup"></div>
                </div>
            </div>
            <p style="font-size:12px;color:var(--muted);margin:0;">
                在「棒次」欄位填入 1、2、3…安排出場順序（可留空表示未上場），同一隊棒次不可重複；未安排任何棒次時，建立後會依球員名單自動排出 1~9 棒。
            </p>
            <button class="btn btn-primary btn-block" id="createGame">建立比賽</button>
        </div>
    </section>

    <!-- 版權標示 -->
    <footer style="text-align:center;color:var(--muted);font-size:12px;padding:24px 0 4px;">
        Copyright © 2026 SupremeEden. All rights reserved.
    </footer>
</div>

<script th:src="@{/js/app.js(v=${T(com.baseball.score.config.AssetVersion).VALUE})}"></script>
<script th:inline="javascript">
    const canEdit = [[${canEdit}]];
    const isAdmin = [[${isAdmin}]];
    let filter = 'live';
    let keyword = '';

    function gameCard(g) {
        const live = g.status === 'LIVE';
        const foot = live
            ? BB.esc(g.inningLabel) + ' · ' + g.outs + ' OUT · 更新時間 ' + BB.esc(g.updatedAt)
            : (g.winner ? BB.esc(g.winner) + '勝 · ' : '') + '最後更新 ' + BB.esc(g.updatedAt);
        // 平常只顯示一枝筆的小圖示；點一下展開下拉選單，選單裡目前只有「刪除比賽」一個選項（僅管理員可見）
        // 之後要加其他動作（例如編輯、複製），直接在 dropdown-menu 裡多加一個 .dropdown-item 按鈕即可
        const actions = isAdmin
            ? `<div class="card-actions" data-delete-id="${g.id}" data-delete-name="${BB.esc(g.name)}">
                   <button type="button" class="icon-toggle" aria-haspopup="true" aria-expanded="false" title="更多操作" aria-label="更多操作">✎</button>
                   <div class="dropdown-menu" hidden>
                       <button type="button" class="dropdown-item danger" data-action="delete">🗑 刪除比賽</button>
                   </div>
               </div>`
            : '';
        return `
            <a class="card game-card" href="/games/${g.id}">
                <div class="row1">
                    <span class="pill ${live ? 'pill-live' : 'pill-done'}">${BB.esc(g.statusLabel)}</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="color:var(--muted);font-size:12px;">${BB.esc(g.gameDate)}</span>
                        ${actions}
                    </div>
                </div>
                <div style="font-weight:700;margin-top:8px;">${BB.esc(g.name)}</div>
                <div class="score-line">
                    <span class="teamname" style="color:var(--blue);">${BB.esc(g.awayName)}</span>
                    <span class="n" style="color:var(--blue);">${g.awayScore}</span>
                    <span style="color:var(--muted);">:</span>
                    <span class="n" style="color:var(--red);">${g.homeScore}</span>
                    <span class="teamname" style="color:var(--red);">${BB.esc(g.homeName)}</span>
                </div>
                <div style="text-align:center;color:var(--muted);font-size:12px;">${foot}</div>
            </a>`;
    }

    async function load() {
        try {
            const games = await BB.get('/api/games?filter=' + filter);
            const list = document.getElementById('list');
            const filtered = games.filter(g => !keyword ||
                (g.name + g.awayName + g.homeName + g.gameDate).toLowerCase().includes(keyword));

            const cnt = document.getElementById('cntLive');
            if (filter === 'live') {
                cnt.hidden = filtered.length === 0;
                cnt.textContent = filtered.length;
            }

            list.innerHTML = filtered.length
                ? filtered.map(gameCard).join('')
                : '<div class="card"><div class="empty">目前沒有比賽紀錄</div></div>';
        } catch (e) {
            BB.toast(e.message, true);
        }
    }

    // 卡片右上角的下拉選單：點鉛筆圖示開關選單；卡片本身是 <a> 連結，
    // 用事件委派 + preventDefault/stopPropagation 避免誤觸連結導航
    function closeAllMenus() {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.hidden = true);
        document.querySelectorAll('.icon-toggle').forEach(b => b.setAttribute('aria-expanded', 'false'));
    }

    document.getElementById('list').addEventListener('click', async (e) => {
        const actions = e.target.closest('.card-actions');
        const toggleBtn = e.target.closest('.icon-toggle');
        const menuItem = e.target.closest('.dropdown-item');

        // 點卡片內其他地方（非選單相關按鈕）：收合所有已展開的選單，讓連結正常導航
        if (!actions) {
            closeAllMenus();
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        // 點鉛筆圖示：開關這張卡片的下拉選單，其他卡片已展開的先收合
        if (toggleBtn) {
            const menu = actions.querySelector('.dropdown-menu');
            const willOpen = menu.hidden;
            closeAllMenus();
            menu.hidden = !willOpen;
            toggleBtn.setAttribute('aria-expanded', String(willOpen));
            return;
        }

        // 點選單裡的項目：目前只有「刪除比賽」，之後新增其他動作時依 data-action 分流即可
        if (menuItem) {
            closeAllMenus();
            if (menuItem.dataset.action === 'delete') {
                const id = actions.dataset.deleteId;
                const name = actions.dataset.deleteName;
                if (!confirm(`確定要刪除「${name}」這場比賽嗎？\n所有打席、投球、比分等紀錄都會一併刪除，且無法復原。`)) return;

                menuItem.disabled = true;
                try {
                    await BB.del('/api/games/' + id);
                    BB.toast('比賽紀錄已刪除');
                    load();
                } catch (err) {
                    BB.toast(err.message, true);
                }
            }
        }
    });

    // 點卡片以外的地方（例如空白處），收合所有已展開的選單
    document.addEventListener('click', (e) => {
        if (e.target.closest('.card-actions')) return;
        closeAllMenus();
    });

    document.querySelectorAll('[data-filter]').forEach(tab => tab.addEventListener('click', () => {
        filter = tab.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(t => t.classList.toggle('active', t === tab));
        document.getElementById('cntLive').hidden = filter !== 'live';
        load();
    }));

    document.getElementById('search').addEventListener('input', e => {
        keyword = e.target.value.trim().toLowerCase();
        load();
    });

    const logout = document.getElementById('logoutBtn');
    if (logout) logout.addEventListener('click', async () => {
        await BB.post('/api/auth/logout');
        location.href = '/';
    });

    const newBtn = document.getElementById('newGameBtn');
    if (newBtn) {

        /** 渲染單一球隊的排打線表格：棒次輸入框 + 背號 + 姓名 + 守備位置下拉 */
        function renderLineupSetup(box, players) {
            if (!players.length) {
                box.innerHTML = '<div class="empty" style="padding:8px 0;">這支球隊尚未建立球員</div>';
                return;
            }
            const posOptions = (selected) => ['<option value="">（未設定）</option>']
                .concat(BB.POSITIONS.map(p => `<option value="${p}" ${p === selected ? 'selected' : ''}>${p}</option>`)).join('');
            box.innerHTML = `
                <table class="lineup-setup-table" style="width:100%;font-size:12px;border-collapse:collapse;">
                    <thead>
                        <tr style="color:var(--muted);text-align:left;">
                            <th style="width:52px;padding:4px;">棒次</th>
                            <th style="padding:4px;">球員</th>
                            <th style="padding:4px;">守備位置</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${players.map(p => `
                            <tr data-player-row data-player-id="${p.id}" style="border-top:1px solid var(--border);">
                                <td style="padding:4px;">
                                    <input type="number" min="1" max="30" class="input lineup-order"
                                           style="width:52px;padding:5px;font-size:12px;" placeholder="-">
                                </td>
                                <td style="padding:4px;">${BB.esc(p.name)}${p.jerseyNumber ? '（#' + BB.esc(p.jerseyNumber) + '）' : ''}</td>
                                <td style="padding:4px;">
                                    <select class="input lineup-position" style="padding:5px;font-size:12px;">
                                        ${posOptions(p.position)}
                                    </select>
                                </td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        async function loadLineupSetup(teamSelectId, boxId) {
            const teamId = document.getElementById(teamSelectId).value;
            const box = document.getElementById(boxId);
            if (!teamId) { box.innerHTML = ''; return; }
            try {
                const team = await BB.get('/api/teams/' + teamId);
                renderLineupSetup(box, team.players || []);
            } catch (e) {
                BB.toast(e.message, true);
            }
        }

        /** 自動把打線區塊中前 9 位球員依序填入棒次 1~9（沿用已選的守備位置） */
        function autoFillLineup(boxId) {
            const rows = document.querySelectorAll('#' + boxId + ' [data-player-row]');
            rows.forEach((row, idx) => {
                const orderInput = row.querySelector('.lineup-order');
                orderInput.value = idx < 9 ? (idx + 1) : '';
            });
        }

        /** 從打線區塊收集出有填棒次的球員，組成建立比賽 API 要的陣列；棒次重複則丟出錯誤訊息 */
        function collectLineup(boxId, teamLabel) {
            const rows = document.querySelectorAll('#' + boxId + ' [data-player-row]');
            const entries = [];
            const usedOrders = new Set();
            rows.forEach(row => {
                const orderVal = row.querySelector('.lineup-order').value.trim();
                if (!orderVal) return;
                const order = parseInt(orderVal, 10);
                if (usedOrders.has(order)) throw new Error(teamLabel + ' 的棒次 ' + order + ' 重複，請確認');
                usedOrders.add(order);
                entries.push({
                    playerId: parseInt(row.dataset.playerId, 10),
                    battingOrder: order,
                    position: row.querySelector('.lineup-position').value || null
                });
            });
            return entries;
        }

        newBtn.addEventListener('click', async () => {
            const form = document.getElementById('newGameForm');
            form.hidden = !form.hidden;
            if (!form.hidden) {
                const teams = await BB.get('/api/teams');
                if (teams.length < 2) BB.toast('請先到「球隊管理」建立至少兩支球隊', true);
                const options = teams.map(t => `<option value="${t.id}">${BB.esc(t.name)}</option>`).join('');
                document.getElementById('gAway').innerHTML = options;
                document.getElementById('gHome').innerHTML = options;
                if (teams.length > 1) document.getElementById('gHome').selectedIndex = 1;
                await loadLineupSetup('gAway', 'awayLineupBox');
                await loadLineupSetup('gHome', 'homeLineupBox');
            }
        });

        document.getElementById('gAway').addEventListener('change', () => loadLineupSetup('gAway', 'awayLineupBox'));
        document.getElementById('gHome').addEventListener('change', () => loadLineupSetup('gHome', 'homeLineupBox'));
        document.getElementById('autoAway').addEventListener('click', () => autoFillLineup('awayLineupBox'));
        document.getElementById('autoHome').addEventListener('click', () => autoFillLineup('homeLineupBox'));

        document.getElementById('createGame').addEventListener('click', async () => {
            try {
                const awayLineup = collectLineup('awayLineupBox', '客隊');
                const homeLineup = collectLineup('homeLineupBox', '主隊');
                const data = await BB.post('/api/games', {
                    name: document.getElementById('gName').value.trim(),
                    gameDate: document.getElementById('gDate').value || null,
                    venue: document.getElementById('gVenue').value.trim(),
                    awayTeamId: parseInt(document.getElementById('gAway').value, 10),
                    homeTeamId: parseInt(document.getElementById('gHome').value, 10),
                    awayLineup: awayLineup.length ? awayLineup : null,
                    homeLineup: homeLineup.length ? homeLineup : null
                });
                location.href = '/games/' + data.id;
            } catch (e) {
                BB.toast(e.message, true);
            }
        });
    }

    load();
    setInterval(load, 15000);
</script>
</body>
</html>
