<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>球隊管理 — 線上棒球比賽紀錄表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" th:href="@{/css/app.css(v=${T(com.baseball.score.config.AssetVersion).VALUE})}">
</head>
<body>
<div class="wrap" style="max-width:720px;">

    <header class="topbar">
        <div class="brand"><span class="ball">⚾</span><span>球隊管理</span></div>
        <div class="topbar-actions">
            <span class="badge badge-muted" th:if="${!canEdit}">👁 瀏覽者（僅可觀看）</span>
            <span class="badge" th:if="${canEdit}" th:text="'✎ ' + ${displayName}">編輯者</span>
            <a class="btn" href="/games">我的比賽</a>
            <a class="btn" th:if="${isAdmin}" href="/admin/users">帳號管理</a>
            <a class="btn" th:if="${!canEdit}" href="/">編輯者登入</a>
        </div>
    </header>

    <div id="list"></div>

    <div th:if="${canEdit}" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" id="newTeamBtn">＋ 新增球隊</button>
    </div>

    <section class="card" id="newTeamForm" hidden style="margin-top:12px;">
        <div class="card-title">新增球隊</div>
        <div class="card-body" style="display:grid;gap:10px;">
            <label><span class="field-label">球隊名稱</span><input class="input" id="tName" placeholder="例如：藍隊"></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <label><span class="field-label">簡稱</span><input class="input" id="tShort" placeholder="藍" maxlength="4"></label>
                <label><span class="field-label">代表色</span><input class="input" id="tColor" type="color" value="#1d4ed8" style="padding:6px;height:46px;"></label>
            </div>
            <button class="btn btn-primary btn-block" id="createTeam">建立球隊</button>
        </div>
    </section>

    <p style="color:var(--muted);font-size:12px;margin-top:16px;">
        點進球隊可維護球員的背號、姓名、守備位置；打擊率會依比賽中的打擊紀錄自動即時計算，不需手動輸入。
    </p>

    <!-- 版權標示 -->
    <footer style="text-align:center;color:var(--muted);font-size:12px;padding:24px 0 4px;">
        Copyright © 2026 SupremeEden. All rights reserved.
    </footer>
</div>

<script th:src="@{/js/app.js(v=${T(com.baseball.score.config.AssetVersion).VALUE})}"></script>
<script th:inline="javascript">
    const canEdit = [[${canEdit}]];
    const isAdmin = [[${isAdmin}]];

    function teamCard(t) {
        // 平常只顯示一枝筆的小圖示；點一下展開下拉選單，選單裡目前只有「刪除球隊」一個選項（僅管理員可見）
        const actions = isAdmin
            ? `<div class="card-actions" data-delete-id="${t.id}" data-delete-name="${BB.esc(t.name)}">
                   <button type="button" class="icon-toggle" aria-haspopup="true" aria-expanded="false" title="更多操作" aria-label="更多操作">✎</button>
                   <div class="dropdown-menu" hidden>
                       <button type="button" class="dropdown-item danger" data-action="delete">🗑 刪除球隊</button>
                   </div>
               </div>`
            : '';
        return `
            <a class="card team-card" href="/teams/${t.id}">
                <span class="team-badge" style="background:${BB.esc(t.color)}">${BB.esc(t.shortName || t.name.slice(0, 1))}</span>
                <span style="flex:1;">
                    <span style="font-weight:700;display:block;">${BB.esc(t.name)}</span>
                    <span style="font-size:12px;color:var(--muted);">${t.playerCount} 位球員</span>
                </span>
                ${actions}
                <span style="color:var(--muted);">›</span>
            </a>`;
    }

    async function load() {
        try {
            const teams = await BB.get('/api/teams');
            const list = document.getElementById('list');
            list.innerHTML = teams.length
                ? teams.map(teamCard).join('')
                : '<div class="card"><div class="empty">還沒有球隊，先新增一支吧</div></div>';
        } catch (e) {
            BB.toast(e.message, true);
        }
    }

    // 卡片右上角的下拉選單：點鉛筆圖示開關選單；卡片本身是 <a> 連結，
    // 用事件委派 + preventDefault/stopPropagation 避免誤觸連結導航
    function closeAllMenus() {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.hidden = true);
        document.querySelectorAll('.icon-toggle').forEach(b => b.setAttribute('aria-expanded', 'false'));
    }

    document.getElementById('list').addEventListener('click', async (e) => {
        const actions = e.target.closest('.card-actions');
        const toggleBtn = e.target.closest('.icon-toggle');
        const menuItem = e.target.closest('.dropdown-item');

        // 點卡片內其他地方（非選單相關按鈕）：收合所有已展開的選單，讓連結正常導航
        if (!actions) {
            closeAllMenus();
            return;
        }

        e.preventDefault();
        e.stopPropagation();

        // 點鉛筆圖示：開關這張卡片的下拉選單，其他卡片已展開的先收合
        if (toggleBtn) {
            const menu = actions.querySelector('.dropdown-menu');
            const willOpen = menu.hidden;
            closeAllMenus();
            if (willOpen) {
                menu.hidden = false;
                toggleBtn.setAttribute('aria-expanded', 'true');
            }
            return;
        }

        if (menuItem) {
            if (menuItem.dataset.action === 'delete') {
                const id = actions.dataset.deleteId;
                const name = actions.dataset.deleteName;
                if (!confirm(`確定要刪除「${name}」這支球隊嗎？\n球隊旗下的球員資料也會一併刪除，且無法復原。\n（若該球隊已有比賽紀錄則無法刪除）`)) return;

                menuItem.disabled = true;
                try {
                    await BB.del('/api/teams/' + id);
                    BB.toast('球隊已刪除');
                    load();
                } catch (err) {
                    BB.toast(err.message, true);
                }
            }
        }
    });

    // 點卡片以外的地方（例如空白處），收合所有已展開的選單
    document.addEventListener('click', (e) => {
        if (e.target.closest('.card-actions')) return;
        closeAllMenus();
    });

    const newBtn = document.getElementById('newTeamBtn');
    if (newBtn) {
        newBtn.addEventListener('click', () => {
            const form = document.getElementById('newTeamForm');
            form.hidden = !form.hidden;
        });
        document.getElementById('createTeam').addEventListener('click', async () => {
            try {
                const data = await BB.post('/api/teams', {
                    name: document.getElementById('tName').value.trim(),
                    shortName: document.getElementById('tShort').value.trim(),
                    colorHex: document.getElementById('tColor').value
                });
                location.href = '/teams/' + data.id;
            } catch (e) {
                BB.toast(e.message, true);
            }
        });
    }

    load();
</script>
</body>
</html>
