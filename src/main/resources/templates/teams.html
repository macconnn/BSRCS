<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>球隊管理 — 線上棒球比賽紀錄表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap" style="max-width:720px;">

    <header class="topbar">
        <div class="brand"><span class="ball">⚾</span><span>球隊管理</span></div>
        <div class="topbar-actions">
            <span class="badge badge-muted" th:if="${!canEdit}">👁 瀏覽者（僅可觀看）</span>
            <span class="badge" th:if="${canEdit}" th:text="'✎ ' + ${displayName}">編輯者</span>
            <a class="btn" href="/games">我的比賽</a>
            <a class="btn" th:if="${!canEdit}" href="/">編輯者登入</a>
        </div>
    </header>

    <div id="list"></div>

    <div th:if="${canEdit}" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" id="newTeamBtn">＋ 新增球隊</button>
    </div>

    <section class="card" id="newTeamForm" hidden style="margin-top:12px;">
        <div class="card-title">新增球隊</div>
        <div class="card-body" style="display:grid;gap:10px;">
            <label><span class="field-label">球隊名稱</span><input class="input" id="tName" placeholder="例如：藍隊"></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <label><span class="field-label">簡稱</span><input class="input" id="tShort" placeholder="藍" maxlength="4"></label>
                <label><span class="field-label">代表色</span><input class="input" id="tColor" type="color" value="#1d4ed8" style="padding:6px;height:46px;"></label>
            </div>
            <button class="btn btn-primary btn-block" id="createTeam">建立球隊</button>
        </div>
    </section>

    <p style="color:var(--muted);font-size:12px;margin-top:16px;">
        點進球隊可維護球員的背號、姓名、守備位置；打擊率會依比賽中的打擊紀錄自動即時計算，不需手動輸入。
    </p>
</div>

<script src="/js/app.js"></script>
<script th:inline="javascript">
    const canEdit = [[${canEdit}]];

    async function load() {
        try {
            const teams = await BB.get('/api/teams');
            const list = document.getElementById('list');
            list.innerHTML = teams.length ? teams.map(t => `
                <a class="card team-card" href="/teams/${t.id}">
                    <span class="team-badge" style="background:${BB.esc(t.color)}">${BB.esc(t.shortName || t.name.slice(0, 1))}</span>
                    <span style="flex:1;">
                        <span style="font-weight:700;display:block;">${BB.esc(t.name)}</span>
                        <span style="font-size:12px;color:var(--muted);">${t.playerCount} 位球員</span>
                    </span>
                    <span style="color:var(--muted);">›</span>
                </a>`).join('')
                : '<div class="card"><div class="empty">還沒有球隊，先新增一支吧</div></div>';
        } catch (e) {
            BB.toast(e.message, true);
        }
    }

    const newBtn = document.getElementById('newTeamBtn');
    if (newBtn) {
        newBtn.addEventListener('click', () => {
            const form = document.getElementById('newTeamForm');
            form.hidden = !form.hidden;
        });
        document.getElementById('createTeam').addEventListener('click', async () => {
            try {
                const data = await BB.post('/api/teams', {
                    name: document.getElementById('tName').value.trim(),
                    shortName: document.getElementById('tShort').value.trim(),
                    colorHex: document.getElementById('tColor').value
                });
                location.href = '/teams/' + data.id;
            } catch (e) {
                BB.toast(e.message, true);
            }
        });
    }

    load();
</script>
</body>
</html>
