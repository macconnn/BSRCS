<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|線上棒球比賽紀錄表（編輯模式）— ${gameName}|">線上棒球比賽紀錄表（編輯模式）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap">

    <!-- ========== 上方工具列 ========== -->
    <header class="topbar">
        <div class="brand">
            <span class="ball">⚾</span>
            <span>線上棒球比賽紀錄表（編輯模式）</span>
        </div>
        <div class="topbar-actions">
            <a class="btn" href="/games">比賽列表</a>
            <a class="btn" href="/teams">球隊管理</a>
            <button class="btn" data-action="save">💾 儲存</button>
            <button class="btn" data-action="reset">🔄 重新開始</button>
            <button class="btn btn-danger" data-action="finish">⏹ 結束比賽</button>
        </div>
    </header>

    <!-- ========== 比分面板 ========== -->
    <section class="scorepanel" id="panel">
        <div>
            <table class="info-table">
                <tr><td colspan="2" style="color:#fff;font-weight:700;padding-bottom:6px;">比賽資訊</td></tr>
                <tr><td>比賽名稱</td><td data-f="name">-</td></tr>
                <tr><td>比賽日期</td><td data-f="gameDate">-</td></tr>
                <tr><td>球場</td><td data-f="venue">-</td></tr>
                <tr><td>備註</td><td data-f="remark">-</td></tr>
            </table>
        </div>
        <div class="score-main">
            <div class="score-team away">
                <div class="tname" data-f="awayName">-</div>
                <div class="tnum" data-f="awayScore">0</div>
            </div>
            <div class="score-mid">
                <div class="inning">▾ <span data-f="inningLabel">1局上</span></div>
                <div class="count"><span data-f="countLabel">0 - 0</span> &nbsp;|&nbsp; <span data-f="outs">0</span><small>OUT</small></div>
            </div>
            <div class="score-team home">
                <div class="tname" data-f="homeName">-</div>
                <div class="tnum" data-f="homeScore">0</div>
            </div>
        </div>
        <div>
            <div class="counts">
                <div class="count-col"><div class="label">好球 (S)</div><div class="dots" data-dots-strike></div></div>
                <div class="count-col"><div class="label">壞球 (B)</div><div class="dots" data-dots-ball></div></div>
                <div class="count-col"><div class="label">出局數 (OUT)</div><div class="dots" data-dots-out></div></div>
            </div>
        </div>
        <div class="bases-box">
            <div class="label">壘包狀態</div>
            <div class="diamond">
                <span class="base-label second">二壘</span>
                <span class="base-label third">三壘</span>
                <span class="base-label first">一壘</span>
                <span class="base-label home">本壘</span>
                <span class="base second" data-base-second></span>
                <span class="base third" data-base-third></span>
                <span class="base first" data-base-first></span>
                <span class="base home"></span>
            </div>
        </div>
    </section>

    <!-- ========== 主要三欄 ========== -->
    <div class="grid-editor">

        <!-- 打線 -->
        <section class="card">
            <div class="tabs">
                <button class="tab away active" data-lineup-tab="away">藍隊打線</button>
                <button class="tab home" data-lineup-tab="home">紅隊打線</button>
            </div>
            <div style="padding:8px 12px;text-align:right;display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn btn-sm" id="posSwapBtn">🔄 換守備位置</button>
                <button class="btn btn-sm" id="subBtn">🔁 換人</button>
            </div>
            <table class="lineup">
                <thead>
                <tr><th>棒次</th><th>背號</th><th>球員</th><th>守備位置</th><th class="avg">打擊率</th></tr>
                </thead>
                <tbody id="lineupBody"></tbody>
            </table>
            <div class="batter-foot" id="batterFoot"></div>
        </section>

        <!-- 打席紀錄 -->
        <section class="card">
            <div class="card-title">打席紀錄</div>
            <div class="card-sub">目前打者：<strong id="currentBatterText" style="color:var(--text)">-</strong></div>
            <div class="card-body">
                <div class="result-grid">
                    <button class="result-btn rb-hit" data-result="SINGLE">安打</button>
                    <button class="result-btn rb-hit" data-result="DOUBLE">二壘安打</button>
                    <button class="result-btn rb-hit" data-result="TRIPLE">三壘安打</button>
                    <button class="result-btn rb-hit" data-result="HOME_RUN">全壘打</button>

                    <button class="result-btn rb-walk" data-result="WALK">四壞球保送</button>
                    <button class="result-btn rb-walk" data-result="HIT_BY_PITCH">觸身球</button>
                    <button class="result-btn rb-walk" data-result="SAC_FLY">犧牲打</button>
                    <button class="result-btn rb-walk" data-result="SAC_BUNT">犧牲觸擊</button>

                    <button class="result-btn rb-infield" data-result="INFIELD_HIT">內野安打</button>
                    <button class="result-btn rb-infield" data-result="INFIELD_GROUND_OUT">內野滾地球</button>
                    <button class="result-btn rb-infield" data-result="INFIELD_FLY_OUT">內野飛球</button>
                    <button class="result-btn rb-infield" data-result="INFIELD_SAC_FLY">內野高飛犧牲打</button>

                    <button class="result-btn rb-out" data-result="OUTFIELD_FLY_OUT">外野飛球</button>
                    <button class="result-btn rb-out" data-result="OUTFIELD_GROUND_OUT">外野滾地球</button>
                    <button class="result-btn rb-out" data-result="FOUL_OUT">界外球</button>
                    <button class="result-btn rb-out" data-result="CAUGHT_STEALING">阻殺</button>

                    <button class="result-btn rb-bad" data-result="DOUBLE_PLAY">雙殺打</button>
                    <button class="result-btn rb-bad" data-result="TRIPLE_PLAY">三殺打</button>
                    <button class="result-btn rb-bad" data-result="ERROR">失誤</button>
                    <button class="result-btn rb-bad" data-result="OTHER">其他</button>
                </div>

                <div class="result-echo" id="resultEcho">本打席結果將顯示於此</div>

                <div class="nav-row">
                    <!-- 2024 需求：暫時隱藏「上一打席／下一打席」按鈕，功能（data-action 綁定）保留，之後如需恢復顯示，取消下方註解即可 -->
                    <!-- <button class="btn" data-action="undo">上一打席</button> -->
                    <!-- <button class="btn btn-primary" data-action="next">下一打席</button> -->
                </div>
            </div>
        </section>

        <!-- 球數 / 投球 / 下位打者 -->
        <div class="stack">
            <section class="card">
                <div class="card-title">球數紀錄</div>
                <div class="card-sub">點擊按鈕記錄投球結果</div>
                <div class="card-body">
                    <div class="pitch-btns">
                        <button class="pitch-btn pb-strike" data-pitch="STRIKE">好球 (S)</button>
                        <button class="pitch-btn pb-ball" data-pitch="BALL">壞球 (B)</button>
                        <button class="pitch-btn pb-foul" data-pitch="FOUL">界外球</button>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
                        <label>
                            <span class="field-label">球種</span>
                            <select class="input" data-pitch-type>
                                <option value="直球">直球</option>
                                <option value="曲球">曲球</option>
                                <option value="滑球">滑球</option>
                                <option value="變速球">變速球</option>
                                <option value="伸卡球">伸卡球</option>
                            </select>
                        </label>
                        <label>
                            <span class="field-label">球速 (km/h)</span>
                            <input class="input" type="number" min="60" max="180" value="140" data-pitch-speed>
                        </label>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-title">投球紀錄 <span style="font-weight:400;color:var(--muted);font-size:12px;">（本打席）</span></div>
                <div class="card-body">
                    <div class="pitch-list scroll-area" id="pitchList"></div>
                    <div class="scroll-hint" id="pitchHint"></div>
                </div>
            </section>

            <section class="card">
                <div class="card-title">下位打者</div>
                <div class="card-body" id="nextBatterBox"></div>
            </section>
        </div>
    </div>

    <!-- ========== 記分板 + 近期賽況 ========== -->
    <div class="grid-editor-bottom">
        <div class="scoreboard" id="scoreboard"></div>
        <section class="card">
            <div class="card-title">近期賽況</div>
            <div class="card-body"><div class="feed" id="feed"></div></div>
        </section>
    </div>
</div>

<script src="/js/app.js"></script>
<script th:inline="javascript">
    const GAME_ID = [[${gameId}]];
    let activeTab = 'away';
    let latest = null;

    function render(state) {
        latest = state;
        const g = state.game;

        // 比賽資訊 / 比分
        const set = (k, v) => document.querySelectorAll('[data-f="' + k + '"]').forEach(el => el.textContent = v);
        set('name', g.name); set('gameDate', g.gameDate); set('venue', g.venue); set('remark', g.remark);
        set('inningLabel', g.inningLabel); set('countLabel', g.countLabel); set('outs', g.outs);
        set('awayName', state.away.name); set('homeName', state.home.name);
        set('awayScore', state.away.score); set('homeScore', state.home.score);

        BB.renderCounts(document, g);
        BB.renderBases(document, g.bases);

        // 打線（依分頁）
        const list = activeTab === 'away' ? state.awayLineup : state.homeLineup;
        BB.renderLineup(document.getElementById('lineupBody'), list, activeTab);
        BB.renderBatterFoot(document.getElementById('batterFoot'), state.currentBatter, '今日成績',
            g.battingSide === 'AWAY' ? 'away' : 'home');

        // 打席
        const b = state.currentBatter;
        document.getElementById('currentBatterText').textContent =
            b ? `${b.name}（#${b.number}） ${b.position}` : '-';

        document.getElementById('resultEcho').textContent =
            state.lastResult ? '上一個打席結果：' + state.lastResult : '本打席結果將顯示於此';

        BB.renderPitches(document.getElementById('pitchList'), state.pitches);
        document.getElementById('pitchHint').textContent =
            state.pitches.length > 5 ? '本打席共 ' + state.pitches.length + ' 球，可上下捲動' : '';

        const n = state.nextBatter;
        document.getElementById('nextBatterBox').innerHTML = n
            ? `<div style="display:flex;align-items:center;gap:12px;font-size:14px;">
                   <span class="chip" style="width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;">${n.order}</span>
                   <strong>${BB.esc(n.name)}</strong>
                   <span style="color:var(--muted)">（#${BB.esc(n.number)}）</span>
                   <span style="color:var(--muted)">${BB.esc(n.position)}</span>
                   <span style="margin-left:auto;font-weight:700;">${BB.esc(n.avg)}</span>
               </div>`
            : '<div class="empty">尚未設定打線</div>';

        BB.renderScoreboard(document.getElementById('scoreboard'), state);
        BB.renderFeed(document.getElementById('feed'), state.events);

        // 比賽結束後停用所有記錄按鈕
        const finished = g.status === 'FINISHED';
        document.querySelectorAll('[data-result],[data-pitch],[data-action="next"],#subBtn,#posSwapBtn')
            .forEach(el => el.disabled = finished);
    }

    async function refresh(data) {
        render(data || await BB.loadState(GAME_ID));
    }

    document.querySelectorAll('[data-lineup-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
            activeTab = tab.dataset.lineupTab;
            document.querySelectorAll('[data-lineup-tab]').forEach(t =>
                t.classList.toggle('active', t.dataset.lineupTab === activeTab));
            if (latest) render(latest);
        });
    });

    document.getElementById('subBtn').addEventListener('click', () => {
        if (!latest) return;
        const list = activeTab === 'away' ? latest.awayLineup : latest.homeLineup;
        BB.openSubstituteModal(GAME_ID, activeTab.toUpperCase(), list, refresh);
    });

    document.getElementById('posSwapBtn').addEventListener('click', () => {
        if (!latest) return;
        const list = activeTab === 'away' ? latest.awayLineup : latest.homeLineup;
        BB.openPositionSwapModal(GAME_ID, activeTab.toUpperCase(), list, refresh);
    });

    BB.initPlayerLog(GAME_ID);
    BB.bindEditorActions(GAME_ID, refresh);
    BB.poll(GAME_ID, render, 30000);   // 編輯模式：動作後即時更新，另每 30 秒同步
</script>
</body>
</html>
