<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的比賽 — 線上棒球比賽紀錄表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap" style="max-width:720px;">

    <header class="topbar">
        <div class="brand"><span class="ball">⚾</span><span>我的比賽</span></div>
        <div class="topbar-actions">
            <span class="badge badge-muted" th:if="${!canEdit}">👁 瀏覽者</span>
            <span class="badge" th:if="${canEdit}" th:text="'✎ ' + ${displayName}">編輯者</span>
            <a class="btn" href="/teams">球隊管理</a>
            <a class="btn" th:if="${!canEdit}" href="/">編輯者登入</a>
            <button class="btn" th:if="${canEdit}" id="logoutBtn">登出</button>
        </div>
    </header>

    <input class="input" id="search" placeholder="搜尋比賽名稱、球隊或日期" style="margin-bottom:12px;">

    <div class="filter-tabs">
        <button class="tab active" data-filter="live">進行中<span class="count" id="cntLive" hidden>0</span></button>
        <button class="tab" data-filter="past">過往比賽</button>
        <button class="tab" data-filter="all">全部</button>
    </div>

    <div id="list"></div>

    <div th:if="${canEdit}" style="margin-top:16px;">
        <button class="btn btn-primary btn-block" id="newGameBtn">＋ 新增比賽</button>
    </div>

    <section class="card" id="newGameForm" hidden style="margin-top:12px;">
        <div class="card-title">新增比賽</div>
        <div class="card-body" style="display:grid;gap:10px;">
            <label><span class="field-label">比賽名稱</span><input class="input" id="gName" placeholder="春季聯賽例行賽"></label>
            <label><span class="field-label">比賽日期</span><input class="input" id="gDate" type="date"></label>
            <label><span class="field-label">球場</span><input class="input" id="gVenue" placeholder="市立棒球場"></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <label><span class="field-label">客隊（先攻）</span><select class="input" id="gAway"></select></label>
                <label><span class="field-label">主隊（後攻）</span><select class="input" id="gHome"></select></label>
            </div>
            <p style="font-size:12px;color:var(--muted);margin:0;">
                建立後會依球員名單自動排出 1~9 棒。
            </p>
            <button class="btn btn-primary btn-block" id="createGame">建立比賽</button>
        </div>
    </section>
</div>

<script src="/js/app.js"></script>
<script th:inline="javascript">
    const canEdit = [[${canEdit}]];
    let filter = 'live';
    let keyword = '';

    function gameCard(g) {
        const live = g.status === 'LIVE';
        const foot = live
            ? BB.esc(g.inningLabel) + ' · ' + g.outs + ' OUT · 更新時間 ' + BB.esc(g.updatedAt)
            : (g.winner ? BB.esc(g.winner) + '勝 · ' : '') + '最後更新 ' + BB.esc(g.updatedAt);
        return `
            <a class="card game-card" href="/games/${g.id}">
                <div class="row1">
                    <span class="pill ${live ? 'pill-live' : 'pill-done'}">${BB.esc(g.statusLabel)}</span>
                    <span style="color:var(--muted);font-size:12px;">${BB.esc(g.gameDate)}</span>
                </div>
                <div style="font-weight:700;margin-top:8px;">${BB.esc(g.name)}</div>
                <div class="score-line">
                    <span class="teamname" style="color:var(--blue);">${BB.esc(g.awayName)}</span>
                    <span class="n" style="color:var(--blue);">${g.awayScore}</span>
                    <span style="color:var(--muted);">:</span>
                    <span class="n" style="color:var(--red);">${g.homeScore}</span>
                    <span class="teamname" style="color:var(--red);">${BB.esc(g.homeName)}</span>
                </div>
                <div style="text-align:center;color:var(--muted);font-size:12px;">${foot}</div>
            </a>`;
    }

    async function load() {
        try {
            const games = await BB.get('/api/games?filter=' + filter);
            const list = document.getElementById('list');
            const filtered = games.filter(g => !keyword ||
                (g.name + g.awayName + g.homeName + g.gameDate).toLowerCase().includes(keyword));

            const cnt = document.getElementById('cntLive');
            if (filter === 'live') {
                cnt.hidden = filtered.length === 0;
                cnt.textContent = filtered.length;
            }

            list.innerHTML = filtered.length
                ? filtered.map(gameCard).join('')
                : '<div class="card"><div class="empty">目前沒有比賽紀錄</div></div>';
        } catch (e) {
            BB.toast(e.message, true);
        }
    }

    document.querySelectorAll('[data-filter]').forEach(tab => tab.addEventListener('click', () => {
        filter = tab.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(t => t.classList.toggle('active', t === tab));
        document.getElementById('cntLive').hidden = filter !== 'live';
        load();
    }));

    document.getElementById('search').addEventListener('input', e => {
        keyword = e.target.value.trim().toLowerCase();
        load();
    });

    const logout = document.getElementById('logoutBtn');
    if (logout) logout.addEventListener('click', async () => {
        await BB.post('/api/auth/logout');
        location.href = '/';
    });

    const newBtn = document.getElementById('newGameBtn');
    if (newBtn) {
        newBtn.addEventListener('click', async () => {
            const form = document.getElementById('newGameForm');
            form.hidden = !form.hidden;
            if (!form.hidden) {
                const teams = await BB.get('/api/teams');
                if (teams.length < 2) BB.toast('請先到「球隊管理」建立至少兩支球隊', true);
                const options = teams.map(t => `<option value="${t.id}">${BB.esc(t.name)}</option>`).join('');
                document.getElementById('gAway').innerHTML = options;
                document.getElementById('gHome').innerHTML = options;
                if (teams.length > 1) document.getElementById('gHome').selectedIndex = 1;
            }
        });

        document.getElementById('createGame').addEventListener('click', async () => {
            try {
                const data = await BB.post('/api/games', {
                    name: document.getElementById('gName').value.trim(),
                    gameDate: document.getElementById('gDate').value || null,
                    venue: document.getElementById('gVenue').value.trim(),
                    awayTeamId: parseInt(document.getElementById('gAway').value, 10),
                    homeTeamId: parseInt(document.getElementById('gHome').value, 10)
                });
                location.href = '/games/' + data.id;
            } catch (e) {
                BB.toast(e.message, true);
            }
        });
    }

    load();
    setInterval(load, 15000);
</script>
</body>
</html>
