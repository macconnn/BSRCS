spring:
  datasource:
    url: jdbc:h2:mem:baseball;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console          # http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true
    show-sql: false
  mail:
    host: localhost
    port: 25

app:
  mail:
    enabled: false               # 開發時驗證碼直接印在 console
